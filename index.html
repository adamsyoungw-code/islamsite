<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Исламские знания</title>
  <meta name="description" content="Исламские знания — уроки по исламским наукам: акыда, фикх, тафсир, хадис, адаб. Аудио, тексты уроков, тесты и библиотека." />
  <meta name="theme-color" content="#1f4733" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4733'/%3E%3Cg fill='none' stroke='%23d9c7a3' stroke-width='3'%3E%3Crect x='20' y='20' width='24' height='24'/%3E%3Crect x='20' y='20' width='24' height='24' transform='rotate(45 32 32)'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // применяем сохранённую тему до отрисовки, чтобы не мигало
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <button class="nav-toggle" id="navToggle" aria-label="Меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 2l2.6 2.6 3.7-.4-.4 3.7L20.5 12l-2.6 2.6.4 3.7-3.7-.4L12 20.5 9.4 17.9l-3.7.4.4-3.7L3.5 12l2.6-2.6-.4-3.7 3.7.4z"/>
          </svg>
        </span>
        <span class="brand-name">Исламские знания</span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="#/" data-nav>Разделы</a>
        <a href="#/library" data-nav>Библиотека</a>
        <div class="auth-box" id="authBox"></div>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему" title="Светлая / тёмная тема">
        <span class="tt-moon" aria-hidden="true">☾</span><span class="tt-sun" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <div id="player" class="player" hidden>
    <div class="container player-inner">
      <div class="player-meta">
        <span class="player-eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="player-title" id="playerTitle"></span>
      </div>
      <audio id="playerAudio" class="player-audio" controls preload="none"></audio>
      <button id="playerClose" class="player-close" aria-label="Закрыть плеер">×</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="muted">© Исламские знания</p>
      <span class="footer-ar" aria-hidden="true">طلب العلم فريضة على كل مسلم</span>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
